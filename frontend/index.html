<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — APEXTASK</title>
    <meta name="description" content="Secure Single-User Login to APEXTASK Productivity Suite">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <!-- Subtle Ambient Lighting Effect -->
    <div class="ambient-glow glow-subtle-1"></div>
    <div class="ambient-glow glow-subtle-2"></div>

    <div class="login-wrapper">
        <div class="login-card" id="login-card">
            <!-- Brand Header -->
            <div class="login-header">
                <div class="login-brand-icon">
                    <i class="fa-solid fa-bolt-lightning"></i>
                </div>
                <h1 class="login-title">Sign in to APEX<span>TASK</span></h1>
                <p class="login-subtitle">Enter your credentials to access your productivity suite</p>
            </div>

            <!-- Error Banner -->
            <div class="login-error-banner hidden" id="login-error-banner">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="login-error-text">Invalid username or password</span>
            </div>

            <!-- Notice / Info Toast for SSO & Forgot Password -->
            <div class="login-info-banner hidden" id="login-info-banner">
                <i class="fa-solid fa-circle-info"></i>
                <span id="login-info-text">Single-operator mode active. Authenticate with your primary operator credentials.</span>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="login-username" class="form-label">Username</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="login-username" class="form-control" placeholder="e.g. mayur" autocomplete="username" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <div class="form-label-row">
                        <label for="login-password" class="form-label">Password</label>
                        <a href="#" class="forgot-pass-link" id="forgot-password-link">Forgot password?</a>
                    </div>
                    <div class="input-with-icon password-input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" autocomplete="current-password" required>
                        <button type="button" class="btn-toggle-password" id="btn-toggle-password" title="Show / Hide Password" aria-label="Toggle password visibility">
                            <i class="fa-solid fa-eye" id="password-toggle-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block login-btn" id="btn-login-submit">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader hidden" id="login-loader"><i class="fa-solid fa-spinner fa-spin"></i> Authenticating...</span>
                </button>
            </form>

            <!-- SSO Divider -->
            <div class="auth-divider">
                <span>Or continue with</span>
            </div>

            <!-- Single Sign-On (SSO) Options -->
            <div class="sso-buttons-row">
                <button type="button" class="btn-sso" data-provider="Google" title="Sign in with Google">
                    <svg class="sso-icon" width="16" height="16" viewBox="0 0 24 24">
                        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
                        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
                        <path fill="#FBBC05" d="M5.6 14.8c-.3-.8-.4-1.8-.4-2.8s.2-1.9.4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/>
                        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
                    </svg>
                    <span>Google</span>
                </button>

                <button type="button" class="btn-sso" data-provider="GitHub" title="Sign in with GitHub">
                    <i class="fa-brands fa-github sso-icon"></i>
                    <span>GitHub</span>
                </button>

                <button type="button" class="btn-sso" data-provider="SAML SSO" title="Sign in with Enterprise SSO">
                    <i class="fa-solid fa-key sso-icon"></i>
                    <span>SSO</span>
                </button>
            </div>

            <!-- Footer Security Details -->
            <div class="login-footer">
                <span class="security-tag"><i class="fa-solid fa-shield-halved"></i> 256-Bit SSL</span>
                <span class="security-tag"><i class="fa-solid fa-database"></i> TiDB Cloud</span>
                <span class="security-tag"><i class="fa-solid fa-server"></i> Vercel Edge</span>
            </div>
        </div>
    </div>

    <!-- Login Controller Script -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = sessionStorage.getItem('apextask_token');
            // If already logged in, verify token and redirect to /app
            if (token) {
                try {
                    const res = await fetch('/api/auth/verify', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.valid) {
                            window.location.href = '/app';
                            return;
                        }
                    }
                } catch (e) {
                    sessionStorage.removeItem('apextask_token');
                }
            }

            // Password Show/Hide Toggle
            const toggleBtn = document.getElementById('btn-toggle-password');
            const passInput = document.getElementById('login-password');
            const toggleIcon = document.getElementById('password-toggle-icon');

            if (toggleBtn && passInput && toggleIcon) {
                toggleBtn.addEventListener('click', () => {
                    const isPass = passInput.type === 'password';
                    passInput.type = isPass ? 'text' : 'password';
                    toggleIcon.className = isPass ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
                });
            }

            // Info banner helper
            const infoBanner = document.getElementById('login-info-banner');
            const infoText = document.getElementById('login-info-text');

            function showInfo(message) {
                infoText.textContent = message;
                infoBanner.classList.remove('hidden');
                setTimeout(() => {
                    infoBanner.classList.add('hidden');
                }, 5000);
            }

            // Forgot Password Click
            const forgotLink = document.getElementById('forgot-password-link');
            if (forgotLink) {
                forgotLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    showInfo('Password reset: Update APP_PASSWORD in your Vercel Environment Variables.');
                });
            }

            // SSO Buttons Click
            document.querySelectorAll('.btn-sso').forEach(btn => {
                btn.addEventListener('click', () => {
                    const provider = btn.dataset.provider || 'SSO';
                    showInfo(`${provider} SSO: Single-operator mode enabled. Please sign in with your username & password above.`);
                });
            });

            // Handle Login Form Submit
            const form = document.getElementById('login-form');
            const card = document.getElementById('login-card');
            const errBanner = document.getElementById('login-error-banner');
            const errText = document.getElementById('login-error-text');
            const btnSubmit = document.getElementById('btn-login-submit');
            const btnText = btnSubmit.querySelector('.btn-text');
            const btnLoader = document.getElementById('login-loader');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errBanner.classList.add('hidden');
                infoBanner.classList.add('hidden');

                const username = document.getElementById('login-username').value.trim();
                const password = document.getElementById('login-password').value;

                if (!username || !password) return;

                // Show loading state
                btnText.classList.add('hidden');
                btnLoader.classList.remove('hidden');
                btnSubmit.disabled = true;

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await res.json();

                    if (res.ok && data.success && data.token) {
                        // Store JWT in sessionStorage
                        sessionStorage.setItem('apextask_token', data.token);
                        sessionStorage.setItem('apextask_user', JSON.stringify(data.user));
                        // Redirect to main app
                        window.location.href = '/app';
                    } else {
                        throw new Error(data.error || 'Invalid credentials. Please verify your username and password.');
                    }
                } catch (err) {
                    // Shake animation on invalid credentials
                    card.classList.remove('shake-card');
                    void card.offsetWidth; // Trigger reflow
                    card.classList.add('shake-card');

                    errText.textContent = err.message;
                    errBanner.classList.remove('hidden');
                } finally {
                    btnText.classList.remove('hidden');
                    btnLoader.classList.add('hidden');
                    btnSubmit.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
